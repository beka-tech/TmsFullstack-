spring:
  application:
    name: tms-api

  datasource:
    url: jdbc:postgresql://localhost:5432/tms
    username: postgres
    password: ${TMS_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

tms:
  payments:
    gateway-url: https://pay.example.et/api
    max-deposit-birr: 5000

logging:
  structured:
    format:
      console: ecs